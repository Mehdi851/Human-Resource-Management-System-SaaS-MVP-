<nav class="settings-sidebar" aria-label="Settings navigation">

  <div class="settings-sidebar__header">
    <span class="settings-sidebar__title">
      Configuration
    </span>
  </div>

  <div class="settings-sidebar__navigation">

    @for (item of navigationItems; track item.route) {

      <a
        class="settings-sidebar__item"
        [routerLink]="[item.route]"
        routerLinkActive="settings-sidebar__item--active"
        [routerLinkActiveOptions]="{ exact: true }">

        <i
          class="settings-sidebar__icon bi"
          [class]="item.icon"
          aria-hidden="true">
        </i>

        <span class="settings-sidebar__label">
          {{ item.label }}
        </span>

      </a>

    }

  </div>

</nav>
