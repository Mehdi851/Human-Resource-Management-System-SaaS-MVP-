<div class="empty-state">
  <div class="empty-state-icon" aria-hidden="true">
    <span>∅</span>
  </div>

  <h3>{{ title() }}</h3>

  <p>{{ message() }}</p>

  @if (actionLabel()) {
    <button
      type="button"
      class="btn btn-primary"
      (click)="action.emit()"
    >
      {{ actionLabel() }}
    </button>
  }
</div>
